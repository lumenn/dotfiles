# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

cursor {
# https://www.reddit.com/r/hyprland/comments/14ac2ls/comment/leuefw4/?utm_source=share&utm_medium=web3x&utm_name=web3xcss&utm_term=1&utm_content=share_button
    # no_hardware_cursors = true
    # no_break_fs_vrr = true
    min_refresh_rate = 240
}


# Constants
$monitor_main = DP-1
$monitor_left = DP-3
$monitor_right = DP-4
$mouse_left_click = mouse:272
$mouse_right_click = mouse:273

## Software
$terminal = kitty
$fileManager = nemo
$menu = rofi -show combi -modes combi -combi-modes "window:~/.config/hypr/scripts/window-focus.fish,drun" -show-icons -matching fuzzy
$emoji = rofi -modi emoji,nerdy -show emoji

## Colors
$dark_green = 124829FF
$medium_green = 246e3dff
$purple = 3d2645ff
$plum = 832161ff
$pink = da4167ff

monitor=,preferred,auto,auto
monitor=$monitor_left, preferred, 0x120, 1
monitor=$monitor_main, highrr , 1920x0, 1
monitor=$monitor_right, preferred, 4480x120, 1
# monitor=HEADLESS-2, disable # For sunshine

# Autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = ~/.config/hypr/scripts/sleep.fish
exec-once = $terminal
exec-once = waybar & hyprpaper
exec-once = ferdium
exec-once = steam -silent
exec-once = zen-browser
exec-once = sleep 5 && keepassxc 
exec-once = udiskie
# exec-once = hyprctl output create headless # For sunshine
exec-once = sunshine
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


# Env variables
env = XCURSOR_SIZE,16
env = HYPRCURSOR_SIZE,16
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/ssh-agent.socket	

# Style
general { 
    gaps_in = 7
    gaps_out = 20

    border_size = 2

    col.active_border = rgba($plum) rgba($purple) 30deg
    col.inactive_border = rgba($medium_green)

    layout = master
}

decoration {
    rounding = 7

    active_opacity = 1
    inactive_opacity = 0.75 

    blur {
        enabled = true
        size = 3
        passes = 2
        noise = 0.075
        xray = false
        popups = true
		noise = 0.01
    }

	shadow {
		enabled = false
	}
}

## Animations
animations {
    enabled = true


    bezier = myBezier, 0.5, -0.1, 0.4, 1.1

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 70%
    animation = border, 1, 1, default
    animation = borderangle, 1, 8, myBezier
    animation = fade, 1, 7, myBezier
    animation = workspaces, 1, 6, myBezier
}

misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false  # If true disables the random hyprland logo / anime girl background. :(
}


# Input
input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }

}

# Keybinds
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, B, layoutmsg, preselect b
bind = $mainMod, N, layoutmsg, orientationnext
bind = $mainMod, Escape, killactive,
bind = $mainMod, X, exit,
bind = $mainMod, U, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, L, exec, hyprlock
bind = $mainMod, space, exec, $menu
bind = $mainMod, COMMA, exec, $emoji
bind = , Print, exec,  grim -g "$(slurp)" - | wl-copy
bind = $mainMod, c, exec, hyprpicker -a
bind = $mainMod, e, exec, nemo
bind = $mainMod, m, exec, amixer -D pulse set Capture toggle
bind = $mainMod, R, exec, hyprctl reload

## Resize windows
bind = CTRL, l, resizeactive, 30 0
bind = CTRL, h, resizeactive, -30 0
bind = CTRL, k, resizeactive, 0 -30
bind = CTRL, j, resizeactive, 0 30
bindm = $mainMod, $mouse_left_click, movewindow
bindm = $mainMod, $mouse_right_click, resizewindow

## Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

## Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

## Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

## Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic


# Windowrules
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .* # You'll probably like this.
}

windowrule {
	name = spawn-right-monitor
	match:class = (Ferdium)|(discord)|(spotify)|(.*KeePassXC)
	monitor = $monitor_right
}

windowrule {
	name = spawn-left-monitor
	match:class = zen
	monitor = $monitor_left
}

windowrule {
	name = float-center
	float = on
	center = on
  	match:title = (rofi*)
}

windowrule {
  name = float-cursor
  float = on
  match:class = (steam)|(.*pavucontrol)
}

windowrule {
  name = steam-main-window
  tile = on
  match:title = Steam
}

windowrule {
  name = steam-big-picture
  tile = on
  match:title = Steam Big Picture Mode
  monitor = $monitor_main
}

windowrule {
  name = steam-friends-list-size
  size = 300 600
  match:title = Friends List
}

windowrule {
  name = darktable-not-transparent
  opacity = 1.0 override 1.0 override 1.0 override
  match:title = darktable
}



